<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>SWACCHA - My Reports</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <!-- HEADER -->

    <header>

        <div class="logo">
            SWACCHA
        </div>

        <nav>
            <a href="index.html">Home</a>
            <a href="dashboard.html">Dashboard</a>
            <a href="report.html">Report Issue</a>
        </nav>

    </header>


    <!-- MY REPORTS -->

    <main class="reports-page">

        <div class="reports-container">

            <h1>My Reports</h1>

            <p class="reports-intro">
                Track the civic issues you have reported.
            </p>


            <div id="reportsList">

                <!-- Reports will appear here -->

            </div>


            <div id="noReports" class="no-reports">

                <div class="card-icon">
                    📭
                </div>

                <h2>No Reports Yet</h2>

                <p>
                    You haven't submitted any civic issues.
                </p>

                <a href="report.html"
                   class="dashboard-button">
                    Report an Issue
                </a>

            </div>

        </div>

    </main>


    <!-- FOOTER -->

    <footer>

        <h2>SWACCHA</h2>

        <p>
            Clean City • Better Tomorrow
        </p>

    </footer>


    <script src="js/script.js"></script>
