<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>SWACCHA - Sign Up</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <!-- HEADER -->

    <header>

        <div class="logo">
            SWACCHA
        </div>

        <nav>
            <a href="index.html">Home</a>
            <a href="login.html">Login</a>
        </nav>

    </header>


    <!-- SIGNUP SECTION -->

    <section class="auth-section">

        <div class="auth-card">

            <h1>Create Account</h1>

            <p class="auth-subtitle">
                Join SWACCHA and help make your city cleaner.
            </p>


            <form id="signupForm">

                <!-- FULL NAME -->

                <label for="name">
                    Full Name
                </label>

                <input
                    type="text"
                    id="name"
                    placeholder="Enter your full name"
                    required
                >


                <!-- MOBILE -->

                <label for="mobile">
                    Mobile Number
                </label>

                <input
                    type="tel"
                    id="mobile"
                    placeholder="Enter your mobile number"
                    required
                >


                <!-- EMAIL -->

                <label for="email">
                    Email
                </label>

                <input
                    type="email"
                    id="email"
                    placeholder="Enter your email"
                    required
                >


                <!-- CITY -->

                <label for="city">
                    City
                </label>

                <input
                    type="text"
                    id="city"
                    placeholder="Enter your city"
                    required
                >


                <!-- AREA -->

                <label for="area">
                    Area / Ward
                </label>

                <input
                    type="text"
                    id="area"
                    placeholder="Enter your area or ward"
                    required
                >


                <!-- PASSWORD -->

                <label for="password">
                    Password
                </label>

                <input
                    type="password"
                    id="password"
                    placeholder="Create a password"
                    required
                >


                <!-- CONFIRM PASSWORD -->

                <label for="confirmPassword">
                    Confirm Password
                </label>

                <input
                    type="password"
                    id="confirmPassword"
                    placeholder="Confirm your password"
                    required
                >


                <button type="submit" class="auth-button">
                    Create Account
                </button>

            </form>


            <p class="login-link">

                Already have an account?

                <a href="login.html">
                    Login
                </a>

            </p>

        </div>

    </section>


    <footer>

        <h2>SWACCHA</h2>

        <p>
            Clean City • Better Tomorrow
        </p>

    </footer>


    <script src="js/script.js"></script>

</body>

</html>
