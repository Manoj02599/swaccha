<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>SWACCHA - Officer Dashboard</title>

    <link rel="stylesheet" href="css/style.css">

</head>


<body>

    <!-- HEADER -->

    <header>

        <div class="logo">
            SWACCHA
        </div>

        <nav>

            <a href="index.html">
                Home
            </a>

            <a href="dashboard.html">
                User Dashboard
            </a>

            <a href="report.html">
                Report Issue
            </a>

        </nav>

    </header>


    <!-- OFFICER DASHBOARD -->

    <main class="officer-page">

        <div class="officer-container">

            <h1>
                Officer Dashboard
            </h1>

            <p class="officer-intro">
                Manage and respond to civic complaints.
            </p>


            <!-- STATISTICS -->

            <div class="officer-stats">

                <div class="officer-stat">

                    <h2 id="totalReports">
                        0
                    </h2>

                    <p>
                        Total Reports
                    </p>

                </div>


                <div class="officer-stat">

                    <h2 id="pendingReports">
                        0
                    </h2>

                    <p>
                        Pending
                    </p>

                </div>


                <div class="officer-stat">

                    <h2 id="progressReports">
                        0
                    </h2>

                    <p>
                        In Progress
                    </p>

                </div>


                <div class="officer-stat">

                    <h2 id="resolvedReports">
                        0
                    </h2>

                    <p>
                        Resolved
                    </p>

                </div>

            </div>


            <!-- REPORTS -->

            <div class="officer-reports">

                <div class="section-header">

                    <h2>
                        Complaint Management
                    </h2>

                    <button
                        id="refreshReports"
                        class="refresh-button">

                        🔄 Refresh

                    </button>

                </div>


                <div id="officerReportsList">
                    

                    <!-- Reports will appear here -->

                </div>


                <div
                    id="noOfficerReports"
                    class="no-reports">

                    <div class="card-icon">
                        📭
                    </div>

                    <h2>
                        No Complaints
                    </h2>

                    <p>
                        No civic complaints have been submitted yet.
                    </p>

                </div>

            </div>

        </div>

    </main>


    <!-- FOOTER -->

    <footer>

        <h2>
            SWACCHA
        </h2>

        <p>
            Clean City • Better Tomorrow
        </p>

    </footer>
    <script>
    const savedUser = localStorage.getItem("swacchaUser");

    if (!savedUser) {
        window.location.href = "login.html";
    } else {

        const user = JSON.parse(savedUser);

        if (user.role !== "officer") {
            window.location.href = "dashboard.html";
        }
    }
</script>


    <script src="js/script.js"></script>

</body>

</html>
